<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>教師用：提出物ダッシュボード</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); margin: 0; padding: 20px; min-height: 100vh;}
        
        /* 上部タブ切り替え */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 25px; border-radius: 8px 8px 0 0; border: none; font-size: 16px; font-weight: bold; cursor: pointer; background: #ddd; color: #666; transition: 0.2s; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.05); }
        .tab-btn.active { background: white; color: #333; box-shadow: 0 -3px 10px rgba(0,0,0,0.05); }

        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: white; padding: 15px 25px; border-radius: 0 12px 12px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .controls h2 { margin: 0; color: #333; font-weight: bold; }
        .controls-right { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .sort-select { padding: 8px 15px; font-size: 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; background-color: #f9f9f9; cursor: pointer; }
        
        /* 保存して一括消去ボタン（青） */
        .save-clear-btn { background-color: #1976D2; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(25, 118, 210, 0.3); transition: 0.2s; }
        .save-clear-btn:hover { background-color: #1565C0; box-shadow: 0 4px 12px rgba(25, 118, 210, 0.4); }

        /* 保存せずに一括消去ボタン（赤） */
        .delete-all-btn { background-color: #e53935; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(229, 57, 53, 0.3); transition: 0.2s; }
        .delete-all-btn:hover { background-color: #c62828; box-shadow: 0 4px 12px rgba(229, 57, 53, 0.4); }

        .toggle-wrapper { display: flex; align-items: center; gap: 10px; background: #f0f4f8; padding: 8px 15px; border-radius: 20px; border: 1px solid #d9e2ec; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(24px); }
        .toggle-label { font-size: 14px; font-weight: bold; color: #333; cursor: pointer; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .student-card { border: none; border-radius: 12px; padding: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); transition: transform 0.2s; background: white;}
        .student-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .student-card img { width: 100%; border-radius: 8px; cursor: pointer; border: 1px solid #eee; background-color: white; }
        
        .card-info { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;}
        .name { font-weight: bold; color: #444; font-size: 17px; }
        .time { font-size: 12px; color: #888; }
        
        .card-actions { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #ddd; padding-top: 12px; }
        .color-palette { display: flex; gap: 8px; }
        .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #aaa; cursor: pointer; transition: transform 0.1s; }
        .color-btn:hover { transform: scale(1.2); }
        .delete-btn { background-color: #ff5252; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        /* アーカイブリスト */
        .archive-list { display: flex; flex-direction: column; gap: 15px; }
        .archive-item { padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #1976D2; transition: 0.2s;}
        .archive-item:hover { transform: translateX(5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .archive-name { font-size: 18px; font-weight: bold; color: #333; }
        .archive-time { font-size: 14px; color: #888; margin-left: 15px;}
        .archive-del-btn { background-color: #ff5252; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; z-index: 100; }
        #modal img { max-width: 90%; max-height: 80%; background: white; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #modal .modal-name { color: white; font-size: 26px; font-weight: bold; margin-top: 20px; }
        #closeModal { margin-top: 20px; padding: 10px 25px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: white; color: #333; border: none; border-radius: 25px; }
        .loading { text-align: center; color: #888; font-size: 18px; margin-top: 60px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="tab-container">
        <button id="tabCurrent" class="tab-btn active">📝 現在の提出物</button>
        <button id="tabArchive" class="tab-btn">📂 保存済み（アーカイブ）</button>
    </div>

    <div id="currentView">
        <div class="controls">
            <h2>提出物一覧</h2>
            <div class="controls-right">
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" id="galleryToggleBtn">
                        <span class="slider"></span>
                    </label>
                    <label for="galleryToggleBtn" class="toggle-label">生徒のギャラリー閲覧を許可</label>
                </div>
                <div>
                    <select id="sortSelect" class="sort-select">
                        <option value="timeAsc">投稿順（古い順）</option>
                        <option value="timeDesc">投稿順（新しい順）</option>
                        <option value="name">名前順</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="saveAndClearBtn" class="save-clear-btn">💾 保存して一括消去</button>
                    <button id="clearAllBtn" class="delete-all-btn">🗑 保存せずに一括消去</button>
                </div>
            </div>
        </div>
        
        <div id="loadingMsg" class="loading">生徒からの送信を待っています...</div>
        <div id="currentGallery" class="gallery"></div>
    </div>

    <div id="archiveView" style="display:none;">
        <div class="controls">
            <h2>保存された授業データ</h2>
        </div>
        <div id="archiveList" class="archive-list"></div>

        <div id="archiveDetailView" style="display:none;">
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                <button id="backToArchiveList" style="background:#fff; border:1px solid #ccc; padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold;">⬅️ 一覧に戻る</button>
                <h2 id="archiveTitle" style="color:#1976D2; margin:0;"></h2>
            </div>
            <div id="archiveGallery" class="gallery"></div>
        </div>
    </div>

    <div id="modal">
        <img id="modalImg" src="">
        <div id="modalName" class="modal-name"></div>
        <button id="closeModal">閉じる</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCVSbYgwZ1GX9Y5xcgXHII7kuz-MuxeWfY",
          authDomain: "share-math1.firebaseapp.com",
          projectId: "share-math1",
          storageBucket: "share-math1.firebasestorage.app",
          messagingSenderId: "992367227268",
          appId: "1:992367227268:web:ece736063786c74aabadd1",
          measurementId: "G-HBWS778WKH"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        /* --- 時間フォーマット関数 --- */
        function formatTime(timestamp) {
            if (!timestamp) return "時刻不明";
            const date = typeof timestamp.toDate === 'function' ? timestamp.toDate() : new Date(timestamp);
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        /* --- ギャラリー描画の共通関数 --- */
        const modal = document.getElementById('modal');
        document.getElementById('closeModal').addEventListener('click', () => { modal.style.display = 'none'; });

        function renderGallery(dataList, containerId, collectionPath, sortMode = 'timeAsc') {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; 

            let sortedData = [...dataList];
            if (sortMode === 'timeAsc') { sortedData.sort((a, b) => (a.data.timestamp?.toMillis() || 0) - (b.data.timestamp?.toMillis() || 0)); }
            else if (sortMode === 'timeDesc') { sortedData.sort((a, b) => (b.data.timestamp?.toMillis() || 0) - (a.data.timestamp?.toMillis() || 0)); }
            else if (sortMode === 'name') { sortedData.sort((a, b) => a.data.name.localeCompare(b.data.name)); }

            sortedData.forEach(item => {
                const id = item.id; const data = item.data; const bgColor = data.color || '#ffffff';
                const card = document.createElement('div'); card.className = 'student-card'; card.style.backgroundColor = bgColor;
                
                const img = document.createElement('img'); img.src = data.image;
                img.addEventListener('click', () => { 
                    document.getElementById('modalImg').src = data.image; 
                    document.getElementById('modalName').textContent = data.name; 
                    modal.style.display = 'flex'; 
                });

                const infoDiv = document.createElement('div'); infoDiv.className = 'card-info';
                infoDiv.innerHTML = `<span class="name">${data.name}</span><span class="time">${formatTime(data.timestamp)}</span>`;

                const actionsDiv = document.createElement('div'); actionsDiv.className = 'card-actions';
                const palette = document.createElement('div'); palette.className = 'color-palette';
                const colors = ['#ffffff', '#ffcdd2', '#bbdefb', '#fff9c4', '#c8e6c9']; 
                colors.forEach(color => {
                    const cBtn = document.createElement('div'); cBtn.className = 'color-btn'; cBtn.style.backgroundColor = color;
                    cBtn.addEventListener('click', () => { db.collection(collectionPath).doc(id).update({ color: color }); });
                    palette.appendChild(cBtn);
                });

                const delBtn = document.createElement('button'); delBtn.className = 'delete-btn'; delBtn.textContent = '削除';
                delBtn.addEventListener('click', () => { if (confirm(`「${data.name}」を削除しますか？`)) db.collection(collectionPath).doc(id).delete(); });

                actionsDiv.appendChild(palette); actionsDiv.appendChild(delBtn);
                card.appendChild(img); card.appendChild(infoDiv); card.appendChild(actionsDiv); container.appendChild(card);
            });
        }

        /* --- 現在の提出物の処理 --- */
        let currentSubmissionsData = [];
        let currentUnsubscribe = null;

        function startListeningCurrent() {
            if (currentUnsubscribe) currentUnsubscribe();
            currentUnsubscribe = db.collection("submissions").onSnapshot((snapshot) => {
                currentSubmissionsData = []; 
                snapshot.forEach((doc) => { currentSubmissionsData.push({ id: doc.id, data: doc.data() }); });
                
                if (currentSubmissionsData.length === 0) {
                    document.getElementById('loadingMsg').style.display = 'block';
                } else {
                    document.getElementById('loadingMsg').style.display = 'none';
                }
                
                const sortMode = document.getElementById('sortSelect').value;
                renderGallery(currentSubmissionsData, 'currentGallery', 'submissions', sortMode); 
            });
        }
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            renderGallery(currentSubmissionsData, 'currentGallery', 'submissions', e.target.value);
        });

        // 閲覧許可トグル
        const galleryToggleBtn = document.getElementById('galleryToggleBtn');
        db.collection('settings').doc('general').onSnapshot((doc) => {
            if (doc.exists) { galleryToggleBtn.checked = doc.data().isGalleryEnabled; } 
            else { db.collection('settings').doc('general').set({ isGalleryEnabled: true }); galleryToggleBtn.checked = true; }
        });
        galleryToggleBtn.addEventListener('change', (e) => {
            db.collection('settings').doc('general').set({ isGalleryEnabled: e.target.checked }, { merge: true });
        });

        // 保存して一括消去ボタン
        document.getElementById('saveAndClearBtn').addEventListener('click', async () => {
            if (currentSubmissionsData.length === 0) { alert("保存・消去するデータがありません。"); return; }
            
            const sessionName = prompt("保存する授業の名前を入力してください\n（例：1組_1次関数のグラフ）");
            if (!sessionName) return; 

            if (confirm(`現在の提出物を「${sessionName}」として保存し、画面をクリアしますか？`)) {
                const btn = document.getElementById('saveAndClearBtn');
                btn.textContent = "保存中..."; btn.disabled = true;

                try {
                    const archiveRef = db.collection("archives").doc();
                    await archiveRef.set({
                        name: sessionName,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    for (const item of currentSubmissionsData) {
                        await archiveRef.collection("items").doc(item.id).set(item.data);
                        await db.collection("submissions").doc(item.id).delete();
                    }
                    
                    alert("保存とクリアが完了しました！");
                } catch (error) {
                    alert("エラーが発生しました: " + error);
                }
                btn.textContent = "💾 保存して一括消去"; btn.disabled = false;
            }
        });

        // ★新規追加：保存せずに一括消去ボタン
        document.getElementById('clearAllBtn').addEventListener('click', async () => {
            if (currentSubmissionsData.length === 0) { alert("消去するデータがありません。"); return; }
            
            if (confirm("保存せずにすべての提出物を一括消去しますか？\n（※この操作は元に戻せません）")) {
                const btn = document.getElementById('clearAllBtn');
                btn.textContent = "消去中..."; btn.disabled = true;

                try {
                    // データベースから現在の提出物をすべて削除
                    for (const item of currentSubmissionsData) {
                        await db.collection("submissions").doc(item.id).delete();
                    }
                } catch (error) {
                    alert("エラーが発生しました: " + error);
                }
                btn.textContent = "🗑 保存せずに一括消去"; btn.disabled = false;
            }
        });


        /* --- アーカイブ（保存済み）の処理 --- */
        let archiveUnsubscribe = null;

        function loadArchiveList() {
            db.collection("archives").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                const listDiv = document.getElementById('archiveList');
                listDiv.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();
                    const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${dateObj.getMinutes().toString().padStart(2,'0')}`;
                    
                    const item = document.createElement('div');
                    item.className = 'archive-item';
                    item.innerHTML = `
                        <div style="display:flex; align-items:center;">
                            <span class="archive-name">📂 ${data.name}</span>
                            <span class="archive-time">${dateStr}</span>
                        </div>
                    `;
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'archive-del-btn'; delBtn.textContent = '削除';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        if(confirm(`アーカイブ「${data.name}」を完全に削除してもよろしいですか？\n※中の提出物もすべて消えます`)) {
                            doc.ref.delete(); 
                        }
                    });
                    
                    item.appendChild(delBtn);
                    item.addEventListener('click', () => openArchiveDetail(doc.id, data.name));
                    listDiv.appendChild(item);
                });
            });
        }

        function openArchiveDetail(archiveId, archiveName) {
            document.getElementById('archiveList').style.display = 'none';
            document.getElementById('archiveDetailView').style.display = 'block';
            document.getElementById('archiveTitle').textContent = `📂 ${archiveName}`;
            
            if (archiveUnsubscribe) archiveUnsubscribe();
            archiveUnsubscribe = db.collection("archives").doc(archiveId).collection("items").onSnapshot((snapshot) => {
                let archiveData = []; 
                snapshot.forEach((doc) => { archiveData.push({ id: doc.id, data: doc.data() }); });
                renderGallery(archiveData, 'archiveGallery', `archives/${archiveId}/items`, 'timeAsc');
            });
        }

        document.getElementById('backToArchiveList').addEventListener('click', () => {
            document.getElementById('archiveList').style.display = 'flex';
            document.getElementById('archiveDetailView').style.display = 'none';
            if (archiveUnsubscribe) { archiveUnsubscribe(); archiveUnsubscribe = null; }
        });


        /* --- タブ切り替え制御 --- */
        document.getElementById('tabCurrent').addEventListener('click', () => {
            document.getElementById('tabCurrent').classList.add('active');
            document.getElementById('tabArchive').classList.remove('active');
            document.getElementById('currentView').style.display = 'block';
            document.getElementById('archiveView').style.display = 'none';
            if (archiveUnsubscribe) { archiveUnsubscribe(); archiveUnsubscribe = null; }
        });

        document.getElementById('tabArchive').addEventListener('click', () => {
            document.getElementById('tabArchive').classList.add('active');
            document.getElementById('tabCurrent').classList.remove('active');
            document.getElementById('currentView').style.display = 'none';
            document.getElementById('archiveView').style.display = 'block';
            
            document.getElementById('archiveList').style.display = 'flex';
            document.getElementById('archiveDetailView').style.display = 'none';
            loadArchiveList(); 
        });

        startListeningCurrent();

    </script>
</body>
</html>
